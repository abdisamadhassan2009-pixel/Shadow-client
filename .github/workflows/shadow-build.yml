name: Build Ghost Client

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Build APK
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          chmod +x ./gradlew
          touch local.properties
          if [ -n "${CF_API_KEY}" ]; then
            echo "curseforge.api_key=${CF_API_KEY}" >> local.properties
          else
            echo "::warning::CURSEFORGE_API_KEY secret is not set; CurseForge search will not work in this build."
          fi
          ./gradlew assembleDebug

      - name: Upload Ghost Client APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: GhostClient-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: github.ref == 'refs/heads/main'
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" GhostClient.apk

      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ghost Client build ${{ github.run_number }}
          body: |
            Download **GhostClient.apk** below and open it on your Android phone to install.
            Requires Minecraft Bedrock bought from Google Play.
          files: GhostClient.apk
          make_latest: true
